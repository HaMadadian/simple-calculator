```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
        }

        .header p {
            margin: 8px 0 0;
            color: #64748b;
            font-size: 15px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            background: #f8fafc;
            color: #0f172a;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            text-align: center;
        }

        .result-label {
            font-size: 13px;
            color: #6366f1;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-value {
            margin-top: 5px;
            font-size: 30px;
            font-weight: 700;
            color: #312e81;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
        }

        .navigation a {
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 8px;
            background: white;
            border: 1px solid #e2e8f0;
            color: #475569;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .navigation a:hover {
            background: #f8fafc;
            color: #4f46e5;
            border-color: #c7d2fe;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 15px;
            }

            .card {
                padding: 22px;
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Simple Calculator</h1>
            <p>Perform quick calculations and keep track of your history</p>
        </div>

        <div class="card">

            <form method="POST">

                <div class="field">
                    <label for="num1">First number</label>
                    <input type="number" id="num1" name="num1" step="any" placeholder="Enter first number" required>
                </div>

                <div class="field">
                    <label for="num2">Second number</label>
                    <input type="number" id="num2" name="num2" step="any" placeholder="Enter second number" required>
                </div>

                <div class="field">
                    <label for="operation">Operation</label>

                    <select id="operation" name="operation">
                        <option value="add" {% if operation=="add" %}selected{% endif %}>
                            Add (+)
                        </option>

                        <option value="multiply" {% if operation=="multiply" %}selected{% endif %}>
                            Multiply (×)
                        </option>
                    </select>
                </div>

                <button type="submit">
                    Calculate
                </button>

            </form>

            {% if result is not none %}
            <div class="result">
                <div class="result-label">Result</div>
                <div class="result-value">
                    {{ result }}
                </div>
            </div>
            {% endif %}

        </div>

        <div class="navigation">
            <a href="/history">History</a>
            <a href="/swagger" target="_blank">Swagger API</a>
        </div>

        <div class="footer">
            Simple Calculator · Version {{ version }}
        </div>

    </div>

</body>

</html>
```
